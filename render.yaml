services:
  - type: web
    name: ethiopian-tax-backend
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: DJANGO_SETTINGS_MODULE=tax_system.settings.production gunicorn tax_system.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: tax_system.settings.production
      - key: DATABASE_URL
        fromDatabase:
          name: ethiopian-tax-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: ethiopian-tax-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://ethiopian-tax-frontend.vercel.app
      - key: FRONTEND_URL
        value: https://ethiopian-tax-frontend.vercel.app
      - key: SESSION_COOKIE_SECURE
        value: True
      - key: CSRF_COOKIE_SECURE
        value: True
      - key: SECURE_SSL_REDIRECT
        value: True
databases:
  - name: ethiopian-tax-db
    databaseName: ethiopian_tax
    user: ethiopian_tax_user
