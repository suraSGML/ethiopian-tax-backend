services:
  - type: web
    name: ethiopian-tax-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn tax_system.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: tax_system.settings.production
      - key: DATABASE_URL
        fromDatabase:
          name: ethiopian-tax-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ethiopian-tax-backend.onrender.com
databases:
  - name: ethiopian-tax-db
    databaseName: ethiopian_tax
    user: ethiopian_tax_user
